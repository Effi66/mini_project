services:
  backend:
    build:
      context: ./backend
    environment:
      AGENT_MODE: ${AGENT_MODE:-deterministic}
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

